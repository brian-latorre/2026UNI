# ============================================
# 2026UNI — Publicar pack a GitHub Pages
# ============================================
# Se dispara en cada push a main que toque archivos del pack.
# Publica el contenido de pack/ como sitio estático en GitHub Pages.

name: Publicar Pack

on:
  push:
    branches: [main]
  
  # Permitir ejecución manual desde la pestaña Actions
  workflow_dispatch:

# Permisos necesarios para GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Solo una publicación a la vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    name: Validar pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar packwiz
        run: |
          echo "Compilando packwiz desde el codigo fuente (workaround para error de directiva replace)..."
          git clone https://github.com/packwiz/packwiz.git
          cd packwiz
          go build -o packwiz
          sudo mv packwiz /usr/local/bin/
          cd ..
          rm -rf packwiz

      - name: Validar pack
        working-directory: pack
        run: |
          echo "=== Validando pack.toml ==="
          cat pack.toml
          echo ""
          echo "=== Refrescando index ==="
          packwiz refresh
          echo ""
          echo "=== Verificando que no hay cambios sin commitear ==="
          git diff --exit-code pack/ || echo "⚠️ index.toml necesita refresh — considera hacer commit del index actualizado"

  deploy:
    name: Publicar a GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Publicar solo el contenido de pack/
          path: 'pack'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
