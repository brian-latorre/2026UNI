[General]
ConfigVersion=1.2
iconKey=default
name=2026UNI
notes=Modpack privado del servidor 2026UNI.\nMinecraft 1.20.1 + Forge 47.4.16\n\nLas actualizaciones se descargan automáticamente al darle Play.

OverrideCommands=true
PreLaunchCommand="$INST_JAVA" -jar "$INST_MC_DIR/packwiz-installer-bootstrap.jar" https://brian-latorre.github.io/2026UNI/pack.toml
PostExitCommand=cmd.exe /c "$INST_DIR/enviar-logs.bat"

OverrideJavaLocation=true
JavaPath=__JAVA_PATH__

OverrideMemory=true
MinMemAlloc=5120
MaxMemAlloc=5120

OverrideJavaArgs=true
JvmArgs=-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1 -Dfml.ignorePatchDiscrepancies=true -Dfml.ignoreInvalidMinecraftCertificates=true

OverrideWindow=true
Maximized=true
